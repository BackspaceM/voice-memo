name: Build and Push Docker Image

# 云端构建推送：本机无法访问 Docker Hub 时，用此工作流在 GitHub Actions 上完成。
# 需先在仓库 Settings -> Secrets 添加 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN（Access Token）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签
        required: true
        default: 0.2.1
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go 单元测试
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go test ./...
        working-directory: backend

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/voice-memo
          tags: |
            type=raw,value=${{ inputs.tag || '0.2.1' }}
            type=raw,value=latest

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
